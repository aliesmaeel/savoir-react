name: Deploy Savoir MCP (manual)

# Manually triggered only. Uses the same SSH secrets as the website deploy
# (HOST, USERNAME, PASSWORD). Never touches the website's files or its pm2
# process (savoir-react); the MCP server runs as its own pm2 process
# "savoir-mcp" on 127.0.0.1:8787 with INQUIRY_MODE=disabled.
#
# Actions:
#   inspect          read-only server inspection, CI-safe summary (pass/fail facts only; logs are public)
#   create-user      create the dedicated non-root run_as user if missing (no sudo, password locked)
#   deploy           build, test, upload and switch to a new release with automatic rollback
#   configure-https  create the nginx/CloudPanel site + Let's Encrypt for mcp.savoirproperties.com (needs root/sudo)
#   rollback         return to the previous healthy release (or rollback_to)
#   stop             stop the MCP pm2 process (website unaffected)
#   set-challenge-token  publish the OpenAI domain-verification token at /.well-known/openai-apps-challenge
#   activity         read-only: counts of tool calls, widget reads and MCP methods in a UTC window (no request contents)
#   widget-domain-on   set WIDGET_DOMAIN=https://<MCP_DOMAIN> (the card's _meta.ui.domain, required for directory submission)
#   widget-domain-off  remove WIDGET_DOMAIN again (undo)
#   log-rotation     pm2-logrotate for the MCP user's pm2 only: daily, keep 30, compress; reports nginx rotation (read-only)
#   map-on / map-off turn the property map (MapLibre + OpenFreeMap) on/off in shared/.env (timestamped backup first), reload
#
# target=test runs a SEPARATE test instance (never touches production): pm2 "savoir-mcp-test", app root
# ~/savoir-mcp-test, 127.0.0.1:8797, https://mcp-test.savoirproperties.com, its own shared/.env and data.
# Only inspect, deploy, configure-https, rollback and stop are allowed for it.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [inspect, activity, create-user, deploy, configure-https, rollback, stop, set-challenge-token, widget-domain-on, widget-domain-off, log-rotation, map-on, map-off]
        default: inspect
      target:
        description: "production (mcp.savoirproperties.com) or test (separate instance at mcp-test.savoirproperties.com)"
        type: choice
        options: [production, test]
        default: production
      confirm:
        description: "Type the action name again to confirm (not needed for inspect or activity)"
        required: false
        default: ""
      run_as:
        description: "Only if the SSH user is root: the non-root Linux user that should own the MCP process"
        required: false
        default: ""
      rollback_to:
        description: "rollback only: release timestamp (YYYYMMDDHHMMSS); empty = previous healthy release"
        required: false
        default: ""
      acme_email:
        description: "configure-https on plain nginx only (certbot contact email); CloudPanel ignores it"
        required: false
        default: ""
      window:
        description: "activity only: UTC window FROM/TO, e.g. 2026-10-06T14:30/2026-10-06T15:10"
        required: false
        default: ""
      challenge_token:
        description: "set-challenge-token only: the domain-verification token shown in the OpenAI Platform (public by design)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-savoir-mcp
  cancel-in-progress: false

env:
  MCP_DOMAIN: ${{ inputs.target == 'test' && 'mcp-test.savoirproperties.com' || 'mcp.savoirproperties.com' }}
  MCP_PORT: ${{ inputs.target == 'test' && '8797' || '8787' }}
  MCP_APP_ROOT: ${{ inputs.target == 'test' && '~/savoir-mcp-test' || '~/savoir-mcp' }}
  MCP_APP_NAME: ${{ inputs.target == 'test' && 'savoir-mcp-test' || 'savoir-mcp' }}
  MCP_TARGET: ${{ inputs.target || 'production' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Savoir_MCP
    steps:
      - name: Validate inputs
        env:
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
          TARGET: ${{ inputs.target }}
          RUN_AS: ${{ inputs.run_as }}
          ROLLBACK_TO: ${{ inputs.rollback_to }}
          ACME_EMAIL: ${{ inputs.acme_email }}
          CHALLENGE_TOKEN: ${{ inputs.challenge_token }}
          WINDOW: ${{ inputs.window }}
        working-directory: .
        run: |
          set -euo pipefail
          if [ "$ACTION" != "inspect" ] && [ "$ACTION" != "activity" ] && [ "$CONFIRM" != "$ACTION" ]; then
            echo "::error::Type '$ACTION' in the confirm field to run this action."; exit 1
          fi
          [[ -z "$RUN_AS" || "$RUN_AS" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || { echo "::error::invalid run_as"; exit 1; }
          [[ "$RUN_AS" != "root" ]] || { echo "::error::run_as must not be root"; exit 1; }
          [[ -z "$ROLLBACK_TO" || "$ROLLBACK_TO" =~ ^[0-9]{14}$ ]] || { echo "::error::invalid rollback_to"; exit 1; }
          [[ -z "$ACME_EMAIL" || "$ACME_EMAIL" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]] || { echo "::error::invalid acme_email"; exit 1; }
          [[ -z "$CHALLENGE_TOKEN" || "$CHALLENGE_TOKEN" =~ ^[A-Za-z0-9._~+/=-]{8,512}$ ]] || { echo "::error::invalid challenge_token"; exit 1; }
          if [ "$ACTION" = "set-challenge-token" ] && [ -z "$CHALLENGE_TOKEN" ]; then echo "::error::challenge_token is required"; exit 1; fi
          if [ "$TARGET" = "test" ]; then
            case "$ACTION" in inspect|deploy|configure-https|rollback|stop) ;; *) echo "::error::$ACTION is production-only"; exit 1 ;; esac
          fi
          if [ "$ACTION" = "activity" ]; then
            [[ "$WINDOW" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}/[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}$ ]] || { echo "::error::window must be YYYY-MM-DDTHH:MM/YYYY-MM-DDTHH:MM (UTC)"; exit 1; }
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Savoir_MCP/package-lock.json

      - run: npm ci

      - name: Typecheck and test
        if: inputs.action == 'deploy'
        run: npm run typecheck && npm test

      - name: Package release (also ships the current server scripts for every action)
        id: pkg
        run: |
          rm -rf release
          npm run release
          REL=$(find release -maxdepth 1 -name 'savoir-mcp-*.tgz' | head -1)
          echo "name=$(basename "$REL")" >> "$GITHUB_OUTPUT"

      - name: Upload release to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          source: Savoir_MCP/release/${{ steps.pkg.outputs.name }}
          target: /tmp/savoir-mcp-upload
          strip_components: 2

      - name: Run "${{ inputs.action }}" on server
        uses: appleboy/ssh-action@v1.2.5
        env:
          ACTION: ${{ inputs.action }}
          RUN_AS: ${{ inputs.run_as }}
          ROLLBACK_TO: ${{ inputs.rollback_to }}
          ACME_EMAIL: ${{ inputs.acme_email }}
          CHALLENGE_TOKEN: ${{ inputs.challenge_token }}
          WINDOW: ${{ inputs.window }}
          REL_NAME: ${{ steps.pkg.outputs.name }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          command_timeout: 15m
          envs: ACTION,RUN_AS,ROLLBACK_TO,ACME_EMAIL,CHALLENGE_TOKEN,WINDOW,REL_NAME,MCP_DOMAIN,MCP_PORT,MCP_APP_ROOT,MCP_APP_NAME,MCP_TARGET
          script: |
            # Run under bash regardless of the remote login shell. The script goes to a file first
            # (not bash -s) so commands that read stdin cannot swallow the rest of it.
            MCP_REMOTE_SCRIPT="$(mktemp /tmp/savoir-mcp-remote.XXXXXX)"
            cat > "$MCP_REMOTE_SCRIPT" <<'REMOTE'
            set -euo pipefail
            UP=/tmp/savoir-mcp-upload
            REL="$UP/$REL_NAME"
            WORK="$(mktemp -d /tmp/savoir-mcp-scripts.XXXXXX)"
            trap 'rm -rf "$WORK"' EXIT
            tar -xzf "$REL" -C "$WORK" deploy
            chmod 755 "$WORK" && chmod -R a+rX "$WORK/deploy" && chmod 755 "$UP" && chmod 644 "$REL"
            echo "SSH user: $(id -un) (uid $(id -u)); target: $MCP_TARGET ($MCP_APP_NAME)"
            # Paths and names of the instance this run acts on (production: ~/savoir-mcp, savoir-mcp).
            A="$MCP_APP_ROOT"; ENVF="$MCP_APP_ROOT/shared/.env"; AENV="APP_ROOT=$MCP_APP_ROOT APP_NAME=$MCP_APP_NAME"

            # Run a command as the user that owns the MCP process (never root).
            as_app() {
              if [ "$(id -u)" -eq 0 ]; then
                if [ -z "$RUN_AS" ]; then
                  echo "::error::The SSH user is root. Re-run with run_as set to a non-root user (e.g. the website's site user)."
                  exit 1
                fi
                runuser -l "$RUN_AS" -c "$1"
              else
                bash -c "$1"
              fi
            }

            local_checks() {
              echo "--- server-local health checks"
              health="$(as_app "curl -fsS -m 5 -H 'Host: $MCP_DOMAIN' http://127.0.0.1:$MCP_PORT/health")"
              echo "$health"
              case "$health" in *'"inquiry_mode":"disabled"'*) ;; *) echo "::error::health check failed or inquiries not disabled"; exit 1 ;; esac
              as_app "curl -fsS -m 15 -H 'Host: $MCP_DOMAIN' http://127.0.0.1:$MCP_PORT/ready"; echo
              as_app "curl -fsS -m 15 -X POST -H 'Host: $MCP_DOMAIN' -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
                -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/list\",\"params\":{}}' http://127.0.0.1:$MCP_PORT/mcp" > "$WORK/tools.txt"
              tools="$(grep -o '"name":"[a-z_]*"' "$WORK/tools.txt" | sort -u | tr '\n' ' ')"
              echo "tools: $tools"
              grep -q 'submit_property_inquiry' "$WORK/tools.txt" && { echo "::error::write tool is advertised"; exit 1; }
              dash="$(as_app "curl -s -o /dev/null -w '%{http_code}' -m 5 -H 'Host: $MCP_DOMAIN' http://127.0.0.1:$MCP_PORT/internal/insights")"
              [ "$dash" = "404" ] && echo "staff dashboard: off" || { echo "::error::staff dashboard answers ($dash); it must stay off"; exit 1; }
              for t in search_properties get_property_details search_offplan_projects get_offplan_project_details get_contact_options; do
                grep -q "\"name\":\"$t\"" "$WORK/tools.txt" || { echo "::error::missing tool $t"; exit 1; }
              done
              echo "--- website unaffected (informational; never fails the run)"
              curl -s -o /dev/null -w "https://savoirproperties.com/ -> %{http_code}\n" -m 15 https://savoirproperties.com/ || true
              pm2 describe savoir-react >/dev/null 2>&1 && pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const p of JSON.parse(s))if(p.name==="savoir-react")console.log("pm2 savoir-react:",p.pm2_env.status)})' || echo "(savoir-react is not in this user's pm2 list)"
            }

            case "$ACTION" in
              inspect)
                RUN_AS="$RUN_AS" MCP_DOMAIN="$MCP_DOMAIN" bash "$WORK/deploy/server/preflight.sh" "$MCP_PORT"
                ;;
              activity)
                # WINDOW was validated to digits, dashes, colons, T and one slash.
                as_app "bash $WORK/deploy/server/activity.sh ${WINDOW%%/*} ${WINDOW##*/}"
                ;;
              create-user)
                [ "$(id -u)" -eq 0 ] || { echo "::error::create-user needs root"; exit 1; }
                [ -n "$RUN_AS" ] || { echo "::error::set run_as to the user to create"; exit 1; }
                if id "$RUN_AS" >/dev/null 2>&1; then
                  echo "user '$RUN_AS' already exists (uid $(id -u "$RUN_AS")); not modified"
                  [ "$(id -u "$RUN_AS")" -ne 0 ] || { echo "::error::'$RUN_AS' is uid 0"; exit 1; }
                else
                  useradd --create-home --shell /bin/bash --user-group --comment "Savoir MCP service (read-only)" "$RUN_AS"
                  passwd -l "$RUN_AS" >/dev/null
                  chmod 750 "/home/$RUN_AS"
                  echo "created user '$RUN_AS' (uid $(id -u "$RUN_AS")), password locked, no sudo, home 750"
                fi
                if id -nG "$RUN_AS" | tr ' ' '\n' | grep -qxE 'sudo|wheel|admin|root'; then echo "::error::'$RUN_AS' is in an admin group; refusing to use it"; exit 1; fi
                runuser -l "$RUN_AS" -c 'echo "node $(node -v), pm2 present: $(command -v pm2 >/dev/null && echo yes || echo no)"'
                RUN_AS="$RUN_AS" MCP_DOMAIN="$MCP_DOMAIN" bash "$WORK/deploy/server/preflight.sh" "$MCP_PORT" | sed -n '/== run_as user/,/crontab/p'
                ;;
              deploy)
                if [ "$(id -u)" -eq 0 ] && [ -n "$RUN_AS" ] && ! id "$RUN_AS" >/dev/null 2>&1; then echo "::error::run_as user '$RUN_AS' does not exist (run create-user first)"; exit 1; fi
                if [ "$MCP_TARGET" = "test" ]; then
                  # First test deploy: the port must be free (not some other service).
                  if ! as_app "pm2 describe $MCP_APP_NAME >/dev/null 2>&1" && (exec 3<>"/dev/tcp/127.0.0.1/$MCP_PORT") 2>/dev/null; then echo "::error::port $MCP_PORT is already in use"; exit 1; fi
                  # The test instance gets its OWN settings (never copied from production): read-only, no dashboard,
                  # MapLibre + OpenFreeMap map, a small CMS budget.
                  as_app "$AENV bash $WORK/deploy/server/test-env.sh $MCP_DOMAIN $MCP_PORT"
                else
                  as_app "mkdir -p ~/savoir-mcp/shared && { [ -f ~/savoir-mcp/shared/.env ] || install -m 600 $WORK/deploy/production.env.example ~/savoir-mcp/shared/.env; }"
                fi
                # Settings added after v0.1: fill them in on the server if missing (secret generated there, never printed).
                as_app 'f='"$ENVF"'; grep -q "^PUBLIC_MCP_URL=." "$f" || echo "PUBLIC_MCP_URL=https://'"$MCP_DOMAIN"'" >> "$f"; grep -q "^ANALYTICS_LINK_SECRET=." "$f" || echo "ANALYTICS_LINK_SECRET=$(openssl rand -hex 32)" >> "$f"; chmod 600 "$f"'
                as_app "grep -qx 'INQUIRY_MODE=disabled' $ENVF" || { echo "::error::shared/.env must contain INQUIRY_MODE=disabled"; exit 1; }
                as_app "grep -q '^INSIGHTS_PASSWORD_HASH=.' $ENVF" && [ "$MCP_TARGET" = "test" ] && { echo "::error::the test instance must not enable the dashboard"; exit 1; }
                as_app "$AENV bash $WORK/deploy/server/deploy.sh $REL"
                # Survive reboots: rely on an existing 'pm2 startup' unit if present, else a user crontab entry.
                as_app 'u=$(id -un); if ls /etc/systemd/system/pm2-"$u".service >/dev/null 2>&1; then echo "pm2 startup unit present for $u"; elif ! command -v crontab >/dev/null; then echo "::warning::no pm2 startup unit and no crontab: savoir-mcp will not restart after a reboot until one is configured"; elif crontab -l 2>/dev/null | grep -q "pm2 resurrect"; then echo "reboot cron present"; else (crontab -l 2>/dev/null; echo "@reboot $(command -v pm2) resurrect") | crontab - && echo "added @reboot pm2 resurrect"; fi'
                local_checks
                rm -f "$REL" || true
                ;;
              configure-https)
                local_checks
                SITE_USER="$([ "$MCP_TARGET" = "test" ] && echo savoir-mcp-test-proxy || echo savoir-mcp-proxy)"
                if [ "$(id -u)" -eq 0 ]; then DOMAIN="$MCP_DOMAIN" PORT="$MCP_PORT" ACME_EMAIL="$ACME_EMAIL" SITE_USER="$SITE_USER" bash "$WORK/deploy/server/configure-https.sh"
                elif sudo -n true 2>/dev/null; then sudo -n env DOMAIN="$MCP_DOMAIN" PORT="$MCP_PORT" ACME_EMAIL="$ACME_EMAIL" SITE_USER="$SITE_USER" bash "$WORK/deploy/server/configure-https.sh"
                else echo "::error::configure-https needs root or passwordless sudo"; exit 1; fi
                ;;
              rollback)
                as_app "$AENV bash $A/current/deploy/server/rollback.sh $ROLLBACK_TO"
                local_checks
                ;;
              set-challenge-token)
                # Replace (or add) the token line in shared/.env, reload with the new env, verify locally.
                # Single quotes: $f and ~ expand in the app user's shell. The token (validated
                # to [A-Za-z0-9._~+/=-]) is spliced in from this shell.
                as_app 'f=~/savoir-mcp/shared/.env; { grep -v "^OPENAI_APPS_CHALLENGE_TOKEN=" "$f"; echo "OPENAI_APPS_CHALLENGE_TOKEN='"$CHALLENGE_TOKEN"'"; } > "$f.new" && install -m 600 "$f.new" "$f" && rm -f "$f.new"'
                as_app "grep -qx 'INQUIRY_MODE=disabled' ~/savoir-mcp/shared/.env" || { echo "::error::INQUIRY_MODE must stay disabled"; exit 1; }
                as_app "pm2 reload ~/savoir-mcp/current/deploy/ecosystem.config.cjs --update-env >/dev/null && pm2 save >/dev/null"
                sleep 2
                served="$(as_app "curl -fsS -m 5 -H 'Host: $MCP_DOMAIN' http://127.0.0.1:$MCP_PORT/.well-known/openai-apps-challenge")"
                [ "$served" = "$CHALLENGE_TOKEN" ] && echo "challenge token served locally" || { echo "::error::served token does not match"; exit 1; }
                local_checks
                ;;
              widget-domain-on|widget-domain-off)
                # Replace (or remove) WIDGET_DOMAIN in shared/.env, reload, and check what the card resource now declares.
                if [ "$ACTION" = "widget-domain-on" ]; then line="WIDGET_DOMAIN=https://$MCP_DOMAIN"; else line=""; fi
                as_app 'f=~/savoir-mcp/shared/.env; { grep -v "^WIDGET_DOMAIN=" "$f"; [ -z "'"$line"'" ] || echo "'"$line"'"; } > "$f.new" && install -m 600 "$f.new" "$f" && rm -f "$f.new"'
                as_app "grep -qx 'INQUIRY_MODE=disabled' ~/savoir-mcp/shared/.env" || { echo "::error::INQUIRY_MODE must stay disabled"; exit 1; }
                as_app "pm2 reload ~/savoir-mcp/current/deploy/ecosystem.config.cjs --update-env >/dev/null && pm2 save >/dev/null"
                sleep 3
                as_app "curl -fsS -m 15 -X POST -H 'Host: $MCP_DOMAIN' -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
                  -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"resources/read\",\"params\":{\"uri\":\"ui://savoir/listings-v2.html\"}}' http://127.0.0.1:$MCP_PORT/mcp" > "$WORK/card.txt"
                if [ "$ACTION" = "widget-domain-on" ]; then
                  grep -q "\"domain\":\"https://$MCP_DOMAIN\"" "$WORK/card.txt" && echo "card declares ui.domain https://$MCP_DOMAIN" || { echo "::error::card does not declare the widget domain"; exit 1; }
                else
                  grep -q '"domain":' "$WORK/card.txt" && { echo "::error::card still declares a widget domain"; exit 1; } || echo "card declares no ui.domain (host default)"
                fi
                local_checks
                ;;
              map-on|map-off)
                as_app "$AENV bash $WORK/deploy/server/map-setting.sh ${ACTION#map-}"
                as_app "$AENV pm2 reload $A/current/deploy/ecosystem.config.cjs --update-env >/dev/null && pm2 save >/dev/null"
                sleep 3
                as_app "curl -fsS -m 15 -X POST -H 'Host: $MCP_DOMAIN' -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
                  -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"resources/read\",\"params\":{\"uri\":\"ui://savoir/listings-v2.html\"}}' http://127.0.0.1:$MCP_PORT/mcp" > "$WORK/card.txt"
                if [ "$ACTION" = "map-on" ]; then
                  grep -q '"connectDomains":\["https://tiles.openfreemap.org"\]' "$WORK/card.txt" && grep -q 'sv-ml-worker' "$WORK/card.txt" && echo "card: MapLibre map on, connectDomains https://tiles.openfreemap.org" || { echo "::error::card does not carry the map"; exit 1; }
                else
                  grep -q '"connectDomains":\[\]' "$WORK/card.txt" && ! grep -q 'sv-ml-worker' "$WORK/card.txt" && echo "card: map off" || { echo "::error::card still carries the map"; exit 1; }
                fi
                local_checks
                ;;
              log-rotation)
                # Only the MCP user's own pm2 daemon; the website's pm2 (root) is not touched.
                as_app 'pm2 describe pm2-logrotate >/dev/null 2>&1 || pm2 install pm2-logrotate >/dev/null 2>&1 || { echo "::error::pm2 install pm2-logrotate failed"; exit 1; }'
                as_app 'pm2 set pm2-logrotate:retain 30 >/dev/null && pm2 set pm2-logrotate:rotateInterval "0 0 * * *" >/dev/null && pm2 set pm2-logrotate:max_size 100M >/dev/null && pm2 set pm2-logrotate:compress true >/dev/null && pm2 save >/dev/null'
                as_app 'pm2 jlist | node -e "let s=\"\";process.stdin.on(\"data\",d=>s+=d).on(\"end\",()=>{for(const p of JSON.parse(s))console.log(\"pm2 \"+p.name+\": \"+p.pm2_env.status)})"'
                as_app 'cat ~/.pm2/module_conf.json 2>/dev/null | node -e "let s=\"\";process.stdin.on(\"data\",d=>s+=d).on(\"end\",()=>{const c=(JSON.parse(s||\"{}\")[\"pm2-logrotate\"])||{};console.log(\"pm2-logrotate retain=\"+c.retain+\" rotateInterval=\"+c.rotateInterval+\" max_size=\"+c.max_size+\" compress=\"+c.compress)})"'
                echo "--- nginx log rotation (read-only)"
                for lr in /etc/logrotate.d/nginx /etc/logrotate.d/clp* /etc/logrotate.d/cloudpanel*; do [ -f "$lr" ] && echo "$lr: $(grep -hoE '^\s*(daily|weekly|monthly|rotate [0-9]+|maxage [0-9]+)' "$lr" | tr -s ' \n' ' ')"; done || true
                local_checks
                ;;
              stop)
                as_app "$AENV bash $A/current/deploy/server/rollback.sh --stop"
                curl -s -o /dev/null -w "https://savoirproperties.com/ -> %{http_code}\n" -m 15 https://savoirproperties.com/ || true
                ;;
            esac
            REMOTE
            bash "$MCP_REMOTE_SCRIPT" < /dev/null; rc=$?; rm -f "$MCP_REMOTE_SCRIPT"; exit $rc

      - name: Public endpoint verification
        if: inputs.action == 'deploy' || inputs.action == 'configure-https' || inputs.action == 'rollback' || inputs.action == 'set-challenge-token' || inputs.action == 'widget-domain-on' || inputs.action == 'widget-domain-off' || inputs.action == 'map-on' || inputs.action == 'map-off'
        env:
          CHALLENGE_TOKEN: ${{ inputs.challenge_token }}
        run: |
          set -uo pipefail
          if [ "${{ inputs.action }}" = "set-challenge-token" ]; then
            served="$(curl -fsS -m 10 "https://$MCP_DOMAIN/.well-known/openai-apps-challenge")" || { echo "::error::challenge URL not reachable"; exit 1; }
            [ "$served" = "$CHALLENGE_TOKEN" ] || { echo "::error::public challenge token does not match"; exit 1; }
            echo "challenge token served publicly at https://$MCP_DOMAIN/.well-known/openai-apps-challenge"
          fi
          if ! getent hosts "$MCP_DOMAIN" >/dev/null; then
            if [ "${{ inputs.action }}" = "configure-https" ]; then echo "::error::$MCP_DOMAIN does not resolve"; exit 1; fi
            echo "::notice::$MCP_DOMAIN has no DNS record yet; public checks skipped (server-local checks passed)."; exit 0
          fi
          if ! curl -fsS -m 10 "https://$MCP_DOMAIN/health" >/dev/null; then
            if [ "${{ inputs.action }}" = "configure-https" ]; then echo "::error::https://$MCP_DOMAIN/health not reachable"; exit 1; fi
            echo "::notice::https://$MCP_DOMAIN is not served yet (run configure-https); public checks skipped."; exit 0
          fi
          npm run verify:deployment -- "https://$MCP_DOMAIN"
