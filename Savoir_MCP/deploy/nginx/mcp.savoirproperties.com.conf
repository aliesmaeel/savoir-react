# nginx reverse proxy for the Savoir MCP server.
#
# CloudPanel: do NOT install this file. Create a "Node.js site" for
# mcp.savoirproperties.com with App Port 8787 instead; CloudPanel generates the
# vhost. Then, in the site's Vhost editor, add the three proxy lines marked
# "SSE" below inside its `location /` block.
#
# Plain nginx (no panel): install as /etc/nginx/sites-available/mcp.savoirproperties.com,
# symlink into sites-enabled, then: certbot --nginx -d mcp.savoirproperties.com

server {
    listen 80;
    listen [::]:80;
    server_name mcp.savoirproperties.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.savoirproperties.com;

    # Managed by certbot (or CloudPanel)
    ssl_certificate     /etc/letsencrypt/live/mcp.savoirproperties.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.savoirproperties.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 512k;

    # No query strings in access logs.
    access_log /var/log/nginx/mcp.savoirproperties.com.access.log combined_noquery if=$loggable;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE: Streamable HTTP may stream responses; don't buffer, allow long reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}

# Put these in the http {} context (e.g. /etc/nginx/conf.d/logformat.conf) if you use the access_log line above:
# log_format combined_noquery '[$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
# map $uri $loggable { default 1; }
